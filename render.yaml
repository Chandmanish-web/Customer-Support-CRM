# Render blueprint for deploying backend and frontend.
services:
  - type: web_service
    name: crm-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: MONGO_URI
        value: <replace-with-your-atlas-uri>
      - key: CLIENT_ORIGIN
        value: <replace-with-your-frontend-url>
      - key: PORT
        value: <replace-with-optional-port>

  - type: static_site
    name: crm-frontend
    env: static
    plan: free
    branch: main
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: <replace-with-backend-url>/api
